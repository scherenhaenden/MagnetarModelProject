name: Magnetar Canon Compliance

on:
  push:
    branches: [ master, main, develop, feature/**, fix/**, chore/** ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  validate-canon:
    name: Verify Magnetar Canon Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Magnetar Canon Validator
        run: |
          python scripts/magnetar_check.py --strict
